# Configura a URL base do servidor Ollama.
quarkus.langchain4j.ollama.base-url=http://localhost:11434

quarkus.langchain4j.ollama.devservices.enabled=false

# Define o ID do modelo que o Langchain4j ir� invocar no Ollama. gpt-oss:20b
quarkus.langchain4j.ollama.chat-model.model-id=qwen2.5:7b

# Define um timeout para a chamada.
# Se o modelo demorar mais de 60s para responder, a chamada falhar�.
quarkus.langchain4j.ollama.timeout=5m

quarkus.langchain4j.easy-rag.path=src/main/resources/rag

#reduzir tamanho para chunks mais focados, util em contextos pequenos
quarkus.langchain4j.easy-rag.max-segment-size=100

# 20% de nosso max segment size de 100
quarkus.langchain4j.easy-rag.max-overlap-size=20

quarkus.langchain4j.ollama.embedding-model.model-id=nomic-embed-text:latest
