# Configura a URL base do servidor Ollama.
quarkus.langchain4j.ollama.base-url=http://localhost:11434

quarkus.langchain4j.ollama.devservices.enabled=false

# Define o ID do modelo que o Langchain4j irá invocar no Ollama. gpt-oss:20b
quarkus.langchain4j.ollama.chat-model.model-id=qwen2.5:7b

# Define um timeout para a chamada.
# Se o modelo demorar mais de 60s para responder, a chamada falhará.
quarkus.langchain4j.ollama.timeout=5m

#quarkus.langchain4j.easy-rag.path=src/main/resources/rag

#reduzir tamanho para chunks mais focados, util em contextos pequenos
#quarkus.langchain4j.easy-rag.max-segment-size=100

# 20% de nosso max segment size de 100
#quarkus.langchain4j.easy-rag.max-overlap-size=20

quarkus.langchain4j.ollama.embedding-model.model-id=nomic-embed-text:latest


#A dimensão do vetor deve corresponder a do EmbeddingModel. O modelo "nomic-embed-text" usa vetores de 768 dimensões
quarkus.langchain4j.pgvector.register-vector-pg-extension=true
quarkus.langchain4j.pgvector.dimension=768
quarkus.langchain4j.pgvector.table=travel_embeddings
quarkus.langchain4j.pgvector.drop-table-first=true

# Os logs de request/response do Ollama são emitidos em nível DEBUG.
# Sem subir o nível dessas categorias, o log-requests/log-responses abaixo não aparece no console.
quarkus.log.category."dev.langchain4j".level=DEBUG
quarkus.log.category."io.quarkiverse.langchain4j".level=DEBUG
quarkus.langchain4j.ollama.log-requests=true
quarkus.langchain4j.ollama.log-responses=true

#Definido o cliente como booking-server aqui
quarkus.langchain4j.mcp.booking-server.transport-type=http
quarkus.langchain4j.mcp.booking-server.url=http://localhost:8081/mcp/sse/

# Máximo de tentativas de auto-correção antes de lançar erro
quarkus.langchain4j.guardrails.max-retries=3